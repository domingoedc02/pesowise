# Application Configuration
spring.application.name=PesoWise
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pesowise_db
spring.datasource.username=pesowise_admin
spring.datasource.password=Darkhunter23
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Mail Configuration (Gmail example - update with your SMTP details)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ejdomingo.dev@gmail.com
spring.mail.password=akwfdkiyredsptey
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.pesowise=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# File storage configuration
app.file-storage.receipts-dir=uploads/receipts
app.file-storage.base-url=http://localhost:8080/api/files

# Google Cloud Vision (disabled)
google.cloud.vision.enabled=false

# Tesseract OCR configuration
tesseract.enabled=true
tesseract.data-path=/usr/share/tesseract-ocr/4.00/tessdata
